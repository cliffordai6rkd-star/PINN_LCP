io:
  input: ../nero_ws/runs/insert_usb
  output: ../nero_ws/runs/insert_usb_lerobotv3_dual_rate
  repo_id: insert_usb_lerobotv3_dual_rate
  max_episodes: 121
  no_videos: false
  push_to_hub: false

task: insert_usb
fps: 10
# The action expert is image-anchored. The converter uses the first wrist
# timestamp as the phase origin, then builds a uniform low_fps anchor grid.
master_timestamp_path: cameras/wrist/timestamp_us

# One physical clock, sampled on two phase-locked uniform grids. Each LeRobot
# row is a 10 Hz anchor. High-rate fields contain the eight 80 Hz samples that
# end at that anchor; low_future fields start at the anchor and contain eight
# 10 Hz waypoints (0.7 s from the first to the last waypoint).
timeline:
  mode: dual_rate
  high_fps: 80
  low_fps: 10
  action_horizon: 8
  max_gap_s: 0.051
  store_timestamps: true

features:
  observation.images.wrist:
    dtype: video
    shape: [192, 256, 3]
    h5_path: cameras/wrist/frames
    timestamp_path: cameras/wrist/timestamp_us
    grid: low_anchor
    resample: previous
    allow_stale: true
    # LeRobot 0.4 treats every feature key containing "image" as image data
    # during stats aggregation, even when its dtype is float32.
    emit_age_key: wrist

  observation.joint:
    dtype: float32
    shape: [8, 7]
    h5_path: teleop/q_follower
    timestamp_path: teleop/timestamp_us
    grid: high_past
    resample: linear

  observation.velocity:
    dtype: float32
    shape: [8, 7]
    h5_path: teleop/dq_follower
    timestamp_path: teleop/timestamp_us
    grid: high_past
    resample: linear

  observation.acceleration:
    dtype: float32
    shape: [8, 7]
    h5_path: teleop/ddq_follower
    timestamp_path: teleop/timestamp_us
    grid: high_past
    resample: linear

  observation.torque:
    dtype: float32
    shape: [8, 7]
    h5_path: teleop/tau_follower
    timestamp_path: teleop/timestamp_us
    grid: high_past
    resample: linear

  observation.wrench_ext:
    dtype: float32
    shape: [8, 6]
    h5_path: teleop/wrench_ext
    timestamp_path: teleop/timestamp_us
    grid: high_past
    resample: linear

  # This high-rate reference stream lets the PINN loader construct an action
  # chunk for any high-rate state anchor without relying on a fixed index offset.
  reference.ee_pose:
    dtype: float32
    shape: [8, 7]
    h5_path: teleop/ee_pose_follower
    timestamp_path: teleop/timestamp_us
    grid: high_past
    resample: pose
    transform: ee_pose_matrix_to_quaternion

  # DP supervision: eight waypoints at 10 Hz, beginning at the row anchor.
  action.ee_pose:
    dtype: float32
    shape: [8, 7]
    h5_path: teleop/ee_pose_follower
    timestamp_path: teleop/timestamp_us
    grid: low_future
    resample: pose
    transform: ee_pose_matrix_to_quaternion

  action.joint:
    dtype: float32
    shape: [8, 7]
    h5_path: teleop/q_follower
    timestamp_path: teleop/timestamp_us
    grid: low_future
    resample: linear
