io:
  input: nero_ws/runs/wipe_board
  output: data/train_episode/wipe_board_wm_lbv3
  repo_id: wipe_board_wm_lbv3
  max_episodes: null
  no_videos: true
  push_to_hub: false

task: wipe_board_world_model

# LeRobot needs a nominal fps, but this converter does not create a 100 Hz
# grid. It writes every action-labeled original teleop row exactly once and
# preserves its physical timestamp in timing.state_timestamp_ns. Boundary rows
# without a valid camera-anchor next action are discarded.
fps: 100

timeline:
  mode: raw_lowdim_action_hold
  state_timestamp_path: teleop/timestamp_us
  # Match wipe_board_dp.yaml: use every recorded wrist timestamp directly;
  # each anchor selects the first teleop action at or after it.
  action_fps: 25
  action_anchor_timestamp_path: cameras/wrist/timestamp_us
  max_action_gap_s: 0.020

features:
  observation.joint:
    rate: state
    dtype: float32
    shape: [7]
    h5_path: teleop/q_follower
    align: index

  observation.velocity:
    rate: state
    dtype: float32
    shape: [7]
    h5_path: teleop/dq_follower
    align: index

  observation.torque:
    rate: state
    dtype: float32
    shape: [7]
    h5_path: teleop/tau_follower
    align: index

  observation.wrench_cal:

  observation.wrench_ext:
    rate: state
    dtype: float32
    shape: [6]
    h5_path: teleop/wrench_cal
    align: index

  # Sample exactly once on the same camera anchors used by wipe_board_dp.yaml,
  # then hold that already-selected action over the raw teleop rows.
  action.ee_pose:
    rate: action
    dtype: float32
    shape: [7]
    h5_path: teleop/ee_pose_follower
    timestamp_path: teleop/timestamp_us
    resample: next
    transform: ee_pose_matrix_to_quaternion

  action.joint:
    rate: action
    dtype: float32
    shape: [7]
    h5_path: teleop/q_follower
    timestamp_path: teleop/timestamp_us
    resample: next
