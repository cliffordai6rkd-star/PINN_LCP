io:
  input: data/runs/insert_usb
  output: data/runs/insert_usb_lerobotv3_test
  repo_id: insert_usb_lerobotv3_test
  max_episodes: 121
  no_videos: false
  push_to_hub: false

task: insert_usb
fps: 20.0
master_timestamp_path: cameras/wrist/timestamp_us


# index:直接拿
# nearest:从主时间轴对应的最近的timestamp
# nearest_past_window 


features:
  # observation.images.side_1:
  #   dtype: video
  #   shape: [192, 256, 3]
  #   h5_path: cameras/side_1/frames
  #   timestamp_path: cteleop/timestamp_us
  #   align: nearest

  observation.images.wrist:
    dtype: video
    shape: [192, 256, 3]
    h5_path: cameras/wrist/frames
    timestamp_path: cameras/wrist/timestamp_us
    align: nearest

  # observation.ee_state.ee_pose:
  #   dtype: float32
  #   shape: [4, 4]
  #   h5_path: teleop/ee_pose
  #   timestamp_path: teleop/timestamp_us
  #   align: nearest

  # observation.ee_state.gripper:
  #   dtype: int8
  #   shape: [1]
  #   h5_path: teleop/gripper_state
  #   timestamp_path: teleop/timestamp_us
  #   align: nearest

  observation.joint:
    dtype: float32
    shape: [8,7]
    h5_path: teleop/q_follower
    timestamp_path: teleop/timestamp_us
    align: nearest_past_window 
    window_size: 8

  observation.velocity:
    dtype: float32
    shape: [8,7]
    h5_path: teleop/dq_follower
    timestamp_path: teleop/timestamp_us
    align: nearest_past_window 
    window_size: 8

  observation.acceleration:
    dtype: float32
    shape: [8,7]
    h5_path: teleop/ddq_follower
    timestamp_path: teleop/timestamp_us
    align: nearest_past_window 
    window_size: 8

  observation.torque:
    dtype: float32
    shape: [8,7]
    h5_path: teleop/tau_follower
    timestamp_path: teleop/timestamp_us
    align: nearest_past_window 
    window_size: 8

  observation.wrench_ext:
    dtype: float32
    shape: [8,6]
    h5_path: teleop/wrench_ext
    timestamp_path: teleop/timestamp_us
    align: nearest_past_window 
    window_size: 8


  action.ee_pose:
    dtype: float32
    shape: [8,7]
    h5_path: teleop/ee_pose_follower
    timestamp_path: teleop/timestamp_us
    align: nearest_future_window
    window_size: 8
    transform: ee_pose_matrix_to_quaternion

  action.joint:
    dtype: float32
    shape: [8,7]
    h5_path: teleop/q_follower
    timestamp_path: teleop/timestamp_us
    align: nearest_future_window
    window_size: 8


  # action.gripper_state:
  #   dtype: int8
  #   shape: [1]
  #   h5_path: teleop/gripper_state
  #   timestamp_path: teleop/timestamp_us
  #   align: nearest
        
