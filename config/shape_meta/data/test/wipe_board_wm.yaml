io:
  input: nero_ws/runs/wipe_board
  output: data/train_episode/wipe_board_wm_lbv3
  repo_id: wipe_board_wm_lbv3
  max_episodes: null
  no_videos: true
  push_to_hub: false

task: wipe_board_world_model

# LeRobot needs a nominal fps, but this converter does not create a 100 Hz
# grid. It writes every action-labeled original teleop row exactly once and
# preserves its physical timestamp in timing.state_timestamp_ns. Boundary rows
# without a valid camera-anchor previous action are discarded.
fps: 100

timeline:
  mode: raw_lowdim_action_hold
  state_timestamp_path: teleop/timestamp_us
  # Use every recorded wrist timestamp directly; each anchor selects the
  # latest causal teleop action label at or before it.
  action_fps: 25
  action_anchor_timestamp_path: cameras/wrist/timestamp_us
  max_action_gap_s: 0.020

features:
  observation.joint:
    rate: state
    dtype: float32
    shape: [7]
    h5_path: teleop/q_follower
    align: index

  observation.velocity:
    rate: state
    dtype: float32
    shape: [7]
    h5_path: teleop/dq_follower
    align: index

  observation.torque:
    rate: state
    dtype: float32
    shape: [7]
    h5_path: teleop/tau_follower
    align: index

  observation.delta_q:
    rate: state
    dtype: float32
    shape: [7]
    sources:
      - h5_path: teleop/q_cmd
        align: index
      - h5_path: teleop/q_follower
        align: index
    combine: subtract

  observation.tau_ext:
    rate: state
    dtype: float32
    shape: [7]
    h5_path: teleop/tau_ext_cal
    align: index

  # Sample exactly once on the camera anchors, then ZOH-hold the direct q_cmd
  # action over the raw teleop rows.
  action.joint:
    rate: action
    dtype: float32
    shape: [7]
    h5_path: teleop/q_cmd
    timestamp_path: teleop/timestamp_us
    resample: previous
