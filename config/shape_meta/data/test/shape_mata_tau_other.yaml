io:
  input: data/train_episode/tau_refinement_rts_matched_labels
  output: data/train_episode/tau_refinement_matched_lerobotv3
  repo_id: tau_refinement_matched_lerobotv3
  max_episodes: 100
  no_videos: True
  push_to_hub: false

task: nero_tau_other
master_timestamp_path: teleop/timestamp_us
fps: 100

# index:直接拿
# nearest:从主时间轴对应的最近的timestamp
# nearest_past_window 


