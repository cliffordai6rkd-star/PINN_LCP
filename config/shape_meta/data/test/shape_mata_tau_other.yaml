  #   timestamp_path: teleop/timestamp_us
  #   align: nearest

  observation.joint:
    dtype: float32
    shape: [7]
    h5_path: teleop/q_follower
    timestamp_path: teleop/timestamp_us
    align: pchip
    max_gap_s: 0.05

  observation.velocity:
    dtype: float32
    shape: [7]
    h5_path: teleop/dq_follower
    timestamp_path: teleop/timestamp_us
    align: pchip
    max_gap_s: 0.05

  observation.acceleration:
    dtype: float32
    shape: [7]
    h5_path: teleop/ddq_follower
    timestamp_path: teleop/timestamp_us
    align: pchip
    max_gap_s: 0.05

  # Desired joint displacement used by the low-level position controller.
  # Resample command/state independently, then subtract on the shared 100 Hz grid.
  observation.delta_q:
    dtype: float32
    shape: [7]
    sources:
      # q_cmd is an event/hold signal: use the latest command at or before t.
      - h5_path: teleop/q_cmd
        timestamp_path: teleop/timestamp_us
        align: previous
        allow_stale: true
      # q_follower is a continuous physical trajectory.
      - h5_path: teleop/q_follower
        timestamp_path: teleop/timestamp_us
        align: pchip
        max_gap_s: 0.05
    combine: subtract

  observation.torque:
    dtype: float32
    shape: [7]
    h5_path: teleop/tau_follower
    timestamp_path: teleop/timestamp_us
    align: pchip
    max_gap_s: 0.05

  observation.tau_g:
    dtype: float32
    shape: [7]
    h5_path: teleop/tau_g
    timestamp_path: teleop/timestamp_us
    align: pchip
    max_gap_s: 0.05

  observation.tau_id:
    dtype: float32
    shape: [7]
    h5_path: teleop/tau_id
    timestamp_path: teleop/timestamp_us
    align: pchip
    max_gap_s: 0.05

  observation.tau_other:
    dtype: float32
    shape: [7]
    h5_path: teleop/tau_other_pred
    timestamp_path: teleop/timestamp_us
    align: pchip
    max_gap_s: 0.05


