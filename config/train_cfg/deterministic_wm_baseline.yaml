# Data and training settings copied from cwm_all_50hz.yaml.
# Horizons/rates/downsample remain configurable; downsample never strides actions.
# This baseline optimizes state MSE + contact CE, with no free-dynamics auxiliary.
wm_v3_only: true
train_data:
  format: lerobot_v3
  sources:
  - name: insert_usb
    repo_id: insert_usb_lerobot_v3
    root: ../nero_ws/runs/swm/insert_usb_lerobot_v3
  # - name: push_button
  #   repo_id: push_button_lerobot_v3
  #   root: ../nero_ws/runs/swm/push_button_lerobot_v3
  # - name: cuccumber_peeling
  #   repo_id: cucumber_peeling_lerobot_v3
  #   root: ../nero_ws/runs/swm/cucumber_peeling_lerobot_v3
action_contract:
  semantic: expert_policy_action_target
  type: absolute_ee_pose
  coordinate_frame: link7
  representation: xyz_quaternion
  quaternion_order: xyzw
  quaternion_sign: canonical_w_nonnegative
  absolute_or_relative: absolute
dataloader:
  backend: lerobot
  v3_only: true
  high_fps: 100
  state_history_horizon: 50
  prediction_horizon: 80
  action_condition_horizon: 20
  action_start_offset: 1
  action_condition_mode: direct
  action_key: action.ee_pose
  high_timestamp_key: timing.state_timestamp_ns
  anchor_timestamp_key: timing.action_anchor_timestamp_ns
  action_index_key: timing.action_index
  action_anchor_timestamp_key: timing.action_anchor_timestamp_ns
  pad_history: true
  pad_future: false
  expert_fps: 25.0
  inference_delay_s: 0.0
  action_resample: previous
  action_augmentation:
    enabled: false
    gaussian_std: 0.0
    temporal_jitter: 0
    cached_policy_action_probability: 0.0
  filters:
    q:
      enabled: true
      source_already_filtered: true
      operations:
      - type: lowpass
        cutoff_hz: 15.0
        order: 2
    dq:
      enabled: true
      source_already_filtered: false
      operations:
      - type: lowpass
        cutoff_hz: 15.0
        order: 1
    delta_q:
      enabled: true
      source_already_filtered: true
      operations:
      - type: lowpass
        cutoff_hz: 15.0
        order: 2
    tau:
      enabled: true
      source_already_filtered: false
      operations:
      - type: lowpass
        cutoff_hz: 15.0
        order: 1
  filter_timestamp_unit: ns
  normalize_mode: gaussian
  normalize_lowdim_keys:
  - q
  - dq
  - delta_q
  - tau
  - action
contact_gate:
  enabled: true
  label_mode: three_phase
  metric: tau_ext_l1
  tau_ext_source: tau_measured_minus_tau_free
  phase_label_mode: transition_band
  precontact_duration_s: 0.1
  thresholds:
    tau_ext_l1:
      'off': 0.6
      'on': 3
  consecutive_frames: 5
  class_weights:
  - 1.0
  - 1.0
  - 1.0
model:
  inputs:
  - q
  - dq
  - delta_q
  - tau
  outputs:
  - q
  - tau
  joint_dim: 7
  action_dim: 7
  contact_state_count: 3
  hidden_dim: 128
  state_layers: 2
  action_layers: 2
  dropout: 0.01
  contact_head_hidden_dim: 64
  runtime_checks: false
  use_action_padding_mask: false
  emit_contact_probabilities: false
  decoder_layers: 4
  attention_heads: 4
  ffn_multiplier: 4
  implementation: model.pinn_model.deterministic_world_model.DeterministicRobotStateWorldModel
loss:
  stream_weights:
    q: 1.0
    tau: 1.0
  contact_weight: 0.1
  use_importance_weight: true
train:
  device: cuda:0
  downsample: false
  dataset_on_device: false
  batch_size: 256
  gradient_every: 1
  num_workers: 2
  prefetch_factor: 1
  val_num_workers: 0
  val_prefetch_factor: 1
  val_persistent_workers: false
  max_optimizer_steps: 500000
  num_epochs: 1000000
  checkpoint_every_steps: 50000
  val_ratio: 0.1
  val_every: 2
  split_mode: episode
  seed: 42
  lr: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
  pin_memory: true
  non_blocking_transfer: true
  persistent_workers: false
  defer_metric_sync: true
  device_batch_keys:
  - q
  - dq
  - delta_q
  - tau
  - action
  - action_mask
  - q_future
  - dq_future
  - delta_q_future
  - tau_future
  - contact
  - history_valid_mask
  - contact_future
  - importance_weight
  amp:
    enabled: true
    dtype: bfloat16
  output_dir: outputs/deterministic_wm_baseline_ep2
  monitor_key: val_loss
  top_k: 3
  save_latest_checkpoint: true
  contact_sampling:
    enabled: true
    phase_weights:
    - 1.0
    - 5.0
    - 5.0
    future_phase_reduction: max
    replacement: true
  ema:
    enabled: true
    decay: 0.999
    update_after_step: 0
    update_every: 1
    use_for_validation: true
  scheduler:
    name: cosine
    warmup_steps: 500
    eta_min: 1.0e-06
  early_stopping:
    enabled: true
    patience: 10
    warmup_epochs: 20
    min_delta: 1.0e-06
  wandb:
    enabled: true
    project: contact-world-model
    name: deterministic-wm-baseline
    group: contact-world-model
    tags:
    - q-dq-deltaq-tau
    - direct-action
    - contact-three-phase
    - deterministic
    mode: online
    log_every_steps: 10
