wm_v3_only: true

train_data:
  format: lerobot_v3
  # V3 action anchors are sampled from the first command at/after each state.
  action_alignment: next
  # Optional multi-source form. Each source is loaded as an independent
  # LeRobot v3 dataset and concatenated episode-wise by the WM dataloader.
  sources:
    - name: insert_usb
      repo_id: insert_usb_lerobot_v3
      root: ../../swm/insert_usb_lerobot_v3
    - name: push_button
      repo_id: push_button_lerobot_v3
      root: ../../swm/push_button_lerobot_v3
    - name: cuccumber_peeling
      repo_id: cuccumber_peeling_lerobot_v3
      root: ../../swm/cuccumber_peeling_lerobot_v3

dataloader:
  backend: lerobot
  v3_only: true

  high_fps: 100
  state_history_horizon: 50
  prediction_horizon: 32
  action_condition_horizon: 8
  action_chunk_horizon: 8
  action_start_offset: 1
  action_condition_mode: direct
  action_key: action.joint
  high_timestamp_key: timing.state_timestamp_ns
  anchor_timestamp_key: timing.action_anchor_timestamp_ns
  action_index_key: timing.action_index
  pad_history: true
  pad_future: false

  expert_fps: 25.0
  inference_delay_s: 0.0
  action_resample: nearest

  filters:
    q: {enabled: true, source_already_filtered: true, operations: [{type: lowpass, cutoff_hz: 15.0, order: 2}]}
    dq: {enabled: true, source_already_filtered: true, operations: [{type: lowpass, cutoff_hz: 15.0, order: 2}]}
    delta_q: {enabled: true, source_already_filtered: true, operations: [{type: lowpass, cutoff_hz: 15.0, order: 2}]}
    tau: {enabled: true, source_already_filtered: true, operations: [{type: lowpass, cutoff_hz: 20.0, order: 2}]}
  filter_timestamp_unit: ns

  normalize_mode: gaussian
  normalize_lowdim_keys: [q, dq, delta_q, tau, action]

contact_gate:
  enabled: true
  label_mode: three_phase
  metric: tau_ext_l1
  # Selected from the H5 tau_ext statistics and validated with 5-frame
  # hysteresis: free <= off, rising transition in between, contact >= on.
  # Units follow metric: N for force_xyz_l2, N.m for tau_ext_l1. Selecting
  # contact_gate.metric automatically selects the matching threshold pair.
  thresholds:
    tau_ext_l1: {"off": 0.75, "on": 3}
  consecutive_frames: 5
  class_weights: [1.0, 1.0, 1.0]
  # max_class_weight: 3.0

model:
  inputs: [q, dq, delta_q, tau]
  joint_dim: 7
  action_dim: 7
  contact_state_count: 3
  hidden_dim: 128
  state_layers: 2
  action_layers: 2
  attention_heads: 4
  dropout: 0.01

  flow_layers: 4
  flow_attention_heads: 4
  flow_ffn_multiplier: 4
  flow_inference_steps: 8
  flow_solver: heun
  flow_source_mode: gaussian
  contact_logit_scale: 4.0

loss:
  flow_weight: 1.0
  flow_q_weight: 1.0
  flow_dq_weight: 1.0
  flow_delta_q_weight: 1.0
  flow_tau_weight: 1.0
  q_weight: 1.0
  tau_weight: 1.0
  contact_weight: 1.0
  contact_class_weights: auto
  dq_weight: 0.5
  delta_q_weight: 1.0
  kinematic_consistency_weight: 0.01
  ddq_smoothness_weight: 0.05
  ddq_smoothness_warmup_steps: 1000
  ddq_smoothness_huber_delta: 1.0
  ddq_smoothness_normalize: true
  dt: 0.01

train:
  device: cuda:0
  batch_size: 512
  num_workers: 4
  # Epoch-based budget and chronological checkpoint retention.
  num_epochs: 1000
  checkpoint_every_epochs: 250
  val_ratio: 0.1
  # val_episode_indices: [15, 50, 90]
  split_mode: episode
  seed: 42

  lr: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  validation_flow_time: 0.5
  output_dir: outputs/contact_world_model_ep1
  monitor_key: val_loss
  top_k: 3
  save_latest_checkpoint: false
  contact_sampling:
    enabled: true
    phase_weights: [1.0, 5.0, 5.0]
    future_phase_reduction: max
    replacement: true

  ema:
    enabled: true
    decay: 0.999
    update_after_step: 0
    update_every: 1
    use_for_validation: true

  scheduler:
    name: cosine
    T_max: 800
    eta_min: 0.000001

  early_stopping:
    # Keep val_loss logging without stopping before the configured epoch budget.
    enabled: false
    patience: 30
    warmup_epochs: 20
    min_delta: 0.000001

  wandb:
    enabled: true
    project: contact-world-model
    name: q-dq-deltaq-tau-direct-action-three-phase-contact
    group: contact-world-model
    tags: [q-dq-deltaq-tau, direct-action, contact-three-phase, flow-matching]
    mode: online
    log_every_steps: 10
