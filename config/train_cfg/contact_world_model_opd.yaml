# Contact WM OPD Student configuration.
# Train the Teacher first with contact_world_model.yaml, then point
# distillation.teacher_checkpoint_path to its best checkpoint directory/file.

wm_v3_only: true

train_data:
  format: lerobot_v3
  # V3 action anchors are sampled from the first command at/after each state.
  action_alignment: next
  # Optional multi-source form; all sources must expose the same WM v3 fields.
  sources:
    - name: insert_usb
      repo_id: insert_usb_lerobot_v3
      root: ../../swm/insert_usb_lerobot_v3
    - name: push_button
      repo_id: push_button_lerobot_v3
      root: ../../swm/push_button_lerobot_v3
    - name: cuccumber_peeling
      repo_id: cuccumber_peeling_lerobot_v3
      root: ../../swm/cuccumber_peeling_lerobot_v3

dataloader:
  # repo_id: push_button_lerobot_v3
  # root: ../nero_ws/runs/push_button_lerobot_v3
  backend: lerobot
  v3_only: true

  high_fps: 100
  state_history_horizon: 50
  prediction_horizon: 32
  action_condition_horizon: 8
  action_condition_mode: direct
  action_key: action.joint
  high_timestamp_key: timing.state_timestamp_ns
  anchor_timestamp_key: timing.action_anchor_timestamp_ns
  action_index_key: timing.action_index
  action_start_offset: 1
  pad_history: true
  pad_future: false

  expert_fps: 25.0
  action_chunk_horizon: 8
  inference_delay_s: 0.0
  action_resample: nearest

  filters:
    q: {enabled: true, source_already_filtered: true, operations: [{type: lowpass, cutoff_hz: 15.0, order: 2}]}
    dq: {enabled: true, source_already_filtered: true, operations: [{type: lowpass, cutoff_hz: 15.0, order: 2}]}
    delta_q: {enabled: true, source_already_filtered: true, operations: [{type: lowpass, cutoff_hz: 15.0, order: 2}]}
    tau: {enabled: true, source_already_filtered: true, operations: [{type: lowpass, cutoff_hz: 20.0, order: 2}]}
  filter_timestamp_unit: ns

  normalize_mode: gaussian
  normalize_lowdim_keys: [q, dq, delta_q, tau, action]

contact_gate:
  enabled: true
  label_mode: three_phase
  metric: tau_ext_l1
  thresholds:
    tau_ext_l1: {"off": 0.75, "on": 3}
  consecutive_frames: 5
  class_weights: [1,1,1]
  # max_class_weight: 3.0

model:
  inputs: [q, dq, delta_q, tau]
  joint_dim: 7
  action_dim: 7
  contact_state_count: 3
  hidden_dim: 128
  state_layers: 2
  action_layers: 2
  attention_heads: 4
  dropout: 0.05
  flow_layers: 4
  flow_attention_heads: 4
  flow_ffn_multiplier: 4
  # Student uses 2 ODE evaluations; the Teacher checkpoint is loaded at 8.
  flow_inference_steps: 2
  flow_solver: heun
  flow_source_mode: gaussian
  contact_logit_scale: 4.0

loss:
  flow_weight: 1.0
  flow_q_weight: 1.0
  flow_dq_weight: 1.0
  flow_delta_q_weight: 1.0
  flow_tau_weight: 1.0
  q_weight: 1.0
  tau_weight: 1.0
  contact_weight: 1.0
  contact_class_weights: auto
  dq_weight: 0.5
  delta_q_weight: 1.0
  kinematic_consistency_weight: 0.05
  ddq_smoothness_weight: 0.05
  ddq_smoothness_warmup_steps: 1000
  ddq_smoothness_huber_delta: 1.0
  ddq_smoothness_normalize: true
  dt: 0.01

distillation:
  enabled: true
  teacher_checkpoint_path: outputs/contact_world_model_ep1/checkpoints
  teacher_steps: 8
  student_steps: 2
  weight: 1.0
  rollout_weight: 1.0
  rollout_steps: 4
  rollout_contact:
    enabled: true
    # Checkpoint must be trained with model.inputs=[q, dq, delta_q] and target_key=tau.
    tau_free_checkpoint_path: outputs/tau_free_sequence/pure_teleop_1/checkpoints/epoch_124_val_tau_mse_nm2_0.005756.pt
    weight: 0.2
    physical_consistency_weight: 0.02
    horizon: 32
    backfill: false
    temperature: 0.05
    max_model_batch_size: 1024
  curriculum:
    enabled: true
    epochs: 20
    teacher_weight_start: 1.0
    teacher_weight_end: 0.5
    rollout_weight_start: 0.0
    rollout_weight_end: 1.0

train:
  device: cuda:0
  batch_size: 512
  num_workers: 4
  pin_memory: true
  non_blocking_transfer: true
  persistent_workers: true
  prefetch_factor: 2
  amp:
    enabled: true
    dtype: bfloat16
  # Epoch-based budget and chronological checkpoint retention.
  num_epochs: 200
  checkpoint_every_epochs: 50
  val_ratio: 0.1
  # val_episode_indices: [15, 50, 90]
  split_mode: episode
  seed: 42
  lr: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  validation_flow_time: 0.5
  output_dir: outputs/contact_world_model_opd
  monitor_key: val_loss
  top_k: 2
  save_latest_checkpoint: false
  contact_sampling:
    enabled: true
    phase_weights: [1.0, 5.0, 5.0]
    future_phase_reduction: max
    replacement: true
  ema:
    enabled: true
    decay: 0.999
    update_after_step: 0
    update_every: 1
    use_for_validation: true
  scheduler:
    name: cosine
    T_max: 200
    eta_min: 0.000001
  early_stopping:
    # Keep val_loss logging without stopping before the configured epoch budget.
    enabled: false
    patience: 30
    warmup_epochs: 20
    min_delta: 0.000001
  wandb:
    enabled: true
    project: contact-world-model
    name: contact-wm-opd-student
    group: contact-world-model-opd
    tags: [q-dq-deltaq-tau, direct-action, contact-three-phase, flow-distillation, opd]
    mode: online
    log_every_steps: 10
