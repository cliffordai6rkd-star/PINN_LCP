# Optional T64 -> S8 bridge; supervision remains the original T64.
distillation:
  enabled: true
  teacher_checkpoint_path: /absolute/path/to/original_teacher_ema.pt
  teacher_steps: 64
  student_steps: 8
  local_weight: 1.0
  local_loss_mode: velocity  # legacy; endpoint has h^2 scaling
  execution_weight: 0.0
  # Offline validation assumption: 40 ms delay, 80 ms execution at 100 Hz.
  # Replace d with measured takeover delay; training execution loss stays off.
  execution_window: {delay_steps: 4, execute_steps: 8, mode: prefetch}
  join_weight: 0.0  # optional physical q+dt*dq join, requires dq input
  validation_short_windows: [1, 4, 8]
  diagnostics_every_steps: 0  # off; expensive shared-gradient diagnostics
  terminal_weight: 1.0
  q_d1_weight: 0.05
  q_d2_weight: 0.01
  student_start_probability_max: 0.5
  student_start_probability_warmup_steps: 5000
  contact_distill_weight: 0.1
  contact_ce_weight: 0.0
  validation_seed: 2026
  validation_num_samples: 4
  validation_max_batches: 0
  latency_batches: 1
train:
  device: cuda:0
  output_dir: outputs/contact_world_model_distill_s8
  lr: 3.0e-5
  max_optimizer_steps: 100000
  checkpoint_every_steps: 5000
  batch_size: 64
  top_k: 3
  ema:
    enabled: true
    decay: 0.999
    use_for_validation: true
