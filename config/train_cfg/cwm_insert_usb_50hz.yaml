wm_v3_only: true

train_data:
  format: lerobot_v3
  # Relative roots are resolved from the repository root by the training
  # script (which changes to that directory before launching Python).
  # V3 action anchors follow the recorded wrist-camera timeline. The action
  # chunk uses the next expert snapshot after the currently held command.
  # Optional multi-source form. Each source is loaded as an independent
  # LeRobot v3 dataset and concatenated episode-wise by the WM dataloader.
  sources:
    - name: insert_usb
      repo_id: insert_usb_lerobot_v3
      root: ../nero_ws/runs/swm/insert_usb_lerobot_v3
    # - name: push_button
    #   repo_id: push_button_lerobot_v3
    #   root: ../nero_ws/runs/swm/push_button_lerobot_v3
    # - name: cuccumber_peeling
    #   repo_id: cucumber_peeling_lerobot_v3
    #   root: ../nero_ws/runs/swm/cucumber_peeling_lerobot_v3

action_contract:
  semantic: expert_policy_action_target
  type: absolute_ee_pose
  coordinate_frame: link7
  representation: xyz_quaternion
  quaternion_order: xyzw
  quaternion_sign: canonical_w_nonnegative
  absolute_or_relative: absolute

dataloader:
  backend: lerobot
  v3_only: true

  high_fps: 100
  state_history_horizon: 50
  prediction_horizon: 16
  # Eight consecutive unique 25 Hz action indices, independent of state stride.
  action_condition_horizon: 8
  action_start_offset: 1
  action_condition_mode: direct
  action_key: action.ee_pose
  high_timestamp_key: timing.state_timestamp_ns
  anchor_timestamp_key: timing.action_anchor_timestamp_ns
  action_index_key: timing.action_index
  action_anchor_timestamp_key: timing.action_anchor_timestamp_ns
  pad_history: true
  pad_future: false

  expert_fps: 25.0
  inference_delay_s: 0.0
  # V3 uses recorded action indices/anchors; no state-clock token inference.
  # Resampling below applies only to the legacy fallback path.
  action_resample: previous
  action_augmentation:
    enabled: false
    gaussian_std: 0.0
    temporal_jitter: 0
    cached_policy_action_probability: 0.0

  filters:
    q: {enabled: true, source_already_filtered: true, operations: [{type: lowpass, cutoff_hz: 15.0, order: 2}]}
    dq: {enabled: true, source_already_filtered: false, operations: [{type: lowpass, cutoff_hz: 15.0, order: 1}]}
    delta_q: {enabled: true, source_already_filtered: true, operations: [{type: lowpass, cutoff_hz: 15.0, order: 2}]}
    tau: {enabled: true, source_already_filtered: false, operations: [{type: lowpass, cutoff_hz: 15.0, order: 1}]}
  filter_timestamp_unit: ns

  normalize_mode: gaussian
  normalize_lowdim_keys: [q, dq, delta_q, tau, action]

contact_gate:
  enabled: true
  label_mode: three_phase
  metric: tau_ext_l1
  tau_ext_source: tau_measured_minus_tau_free
  phase_label_mode: transition_band
  precontact_duration_s: 0.1
  # Selected from the H5 tau_ext statistics and validated with 5-frame
  # hysteresis: free <= off, rising transition in between, contact >= on.
  # Units follow metric: N for force_xyz_l2, N.m for tau_ext_l1. Selecting
  # contact_gate.metric automatically selects the matching threshold pair.
  thresholds:
    tau_ext_l1: {"off": 0.6, "on": 3}
  consecutive_frames: 5
  class_weights: [1.0, 1.0, 1.0]
  # max_class_weight: 3.0

model:
  inputs: [q,
          dq,
          delta_q,
          tau]
  # Continuous streams generated by the teacher flow.  If omitted, this
  # defaults to model.inputs; the two sets may be configured independently.
  outputs: [q,
            # dq,
            # delta_q,
            tau]
  joint_dim: 7
  action_dim: 7
  contact_state_count: 3
  hidden_dim: 128
  state_layers: 2
  action_layers: 2
  dropout: 0.01

  flow_layers: 4
  flow_attention_heads: 4
  flow_ffn_multiplier: 4
  flow_inference_steps: 32
  flow_solver: heun
  flow_source_mode: gaussian
  contact_head_hidden_dim: 64
  runtime_checks: false
  use_action_padding_mask: false
  emit_contact_probabilities: false


train:
  device: cuda:0
  # State windows use the 100 Hz interface; downsample affects states only.
  # Action stays at eight consecutive 25 Hz tokens with either setting.
  downsample: true
  # Keep decoded raw columns resident on the GPU. Samples are indexed per
  # batch; the full window cache is not pre-materialized.
  dataset_on_device: false
  batch_size: 128
  gradient_every: 1
  # Curriculum: progressively mask historical tau on complete free-motion windows.
  # Future tau targets and their flow loss remain fully supervised.
  tau_history_mask_warmup_steps: 100000
  # Keep host-memo2y pressure bounded on the 15 GiB training workstation.
  # Validation runs in the main process by default (see val_num_workers).
  num_workers: 2
  prefetch_factor: 1
  val_num_workers: 0
  val_prefetch_factor: 1
  val_persistent_workers: false
  # Optimizer updates are the authoritative training budget. Epoch remains a
  # data-pass/logging counter and does not terminate this run.
  max_optimizer_steps: 500000
  num_epochs: 1000000
  checkpoint_every_steps: 50000
  val_ratio: 0.1
  val_every: 10  # val_episode_indices: [15, 50, 90]
  split_mode: episode
  seed: 42

  lr: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
  pin_memory: true
  non_blocking_transfer: true
  persistent_workers: false
  defer_metric_sync: true
  # Only these tensors participate in the model/loss.  With dataset_on_device,
  # all materialized sample tensors are already on GPU; this list still
  # controls which keys are retained by the generic transfer path.
  device_batch_keys: [q, dq, delta_q, tau, action, action_mask, q_future, dq_future, delta_q_future, tau_future, contact_future, importance_weight]
  amp:
    enabled: true
    dtype: bfloat16
  validation_flow_time: 0.5
  # Validation executes the same integrated sampler used at inference.  The
  # ordinary flow/direct/physics loss remains the training objective; when
  # replace_val_loss is true only the monitor scalar is replaced.
  rollout_validation:
    enabled: false
    feedback_reconditioned: false
    replace_val_loss: false
    # Read only when replace_val_loss is explicitly enabled.
    replace_val_loss_metric: feedback_u32_energy_score
    steps: 32
    solver: heun
    # Reuse the same source for every checkpoint so score changes reflect
    # model quality rather than Gaussian Monte-Carlo noise.
    source_seed: 1234
    # Zero means all validation batches.  Set a positive value for a quicker,
    # sampled diagnostic run on a memory-constrained machine.
    max_batches: 0
    # Offline measurement-updated evaluation, not real closed-loop task
    # performance. Each update uses recorded state and a re-anchored action.
    num_samples: 8
    # Free-running writes the predicted first frame back into history.  It is
    # intentionally shorter by default because each step is a fresh 8-step
    # ODE integration; set to 32 for a full-horizon stress test.
    free_running_steps: 8
    free_running_max_batches: 8
    horizons: [16, 32]
    divergence_abs_threshold: 100.0
  probabilistic_validation:
    enabled: true
    num_samples: 8
    max_batches: 8
    every: 1
    replace_val_loss: true
  checkpoint_visualization:
    enabled: true
    every_saved_checkpoint: true
    # Empty means: deterministically choose the first validation anchor for
    # each existing contact phase and persist the exact indices in a manifest.
    fixed_validation_indices: {}
    # Optional curated same-condition/different-future records. These are
    # plotted as explicit matched references; ordinary phase anchors are not
    # interpreted as a multimodal set.
    paired_validation_indices: {}
    num_samples: 32
    seed: 2027
    use_ema: true
    denormalize_for_plot: true
    wrist_joint_index: 5
    plot_ranges: {}
  output_dir: outputs/cwm_insert_usb_50hz
  monitor_key: val_loss
  top_k: 5
  save_latest_checkpoint: true
  contact_sampling:
    enabled: true
    # free, pre-contact, contact; aggregate the existing future labels only.
    phase_weights: [1.0, 5.0, 5.0]
    future_phase_reduction: max
    replacement: true

  ema:
    enabled: true
    decay: 0.999
    update_after_step: 0
    update_every: 1
    use_for_validation: true

  scheduler:
    name: cosine
    # Total schedule length is train.max_optimizer_steps.
    warmup_steps: 500
    eta_min: 0.000001

  early_stopping:
    # Keep val_loss logging without stopping before the configured epoch budget.
    enabled: false
    patience: 30
    warmup_epochs: 20
    min_delta: 0.000001

  wandb:
    enabled: true
    project: contact-world-model
    name: q-dq-deltaq-tau-direct-action-three-phase-contact
    group: contact-world-model
    tags: [q-dq-deltaq-tau, direct-action, contact-three-phase, flow-matching]
    mode: online
    log_every_steps: 10
