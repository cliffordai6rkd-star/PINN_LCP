# Overlay applied to the pretraining checkpoint configuration.
train_data:
  format: lerobot_v3
  sources:
    - name: wipe_board
      repo_id: wipe_board_lerobot_v3
      root: ../nero_ws/runs/swm/wipe_board_lerobot_v3
train:
  pretrained_checkpoint: outputs/cwm_pretrain_four_tasks/checkpoints/latest.pt
  output_dir: outputs/cwm_finetune_wipe_board
  lr: 0.00001
  batch_size: 64
  max_optimizer_steps: 10000
  checkpoint_every_steps: 1000
  split_mode: episode
  wandb:
    name: cwm-finetune-wipe-board
