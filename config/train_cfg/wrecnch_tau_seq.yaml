# 直接端到端预测tau、wrench


dataloader:
  repo_id: nero_refinement_lerobotv3
  root: data/train_episode/nero_refinement_lerobotv3/nero_refinement_lerobotv3
  load_images: false
  video_backend: torchcodec

  # FACTR 2/NEXT uses a 50-step history at 100 Hz.
  horizon: 50
  # Early windows are left-padded with normalized zeros.
  pad_history: true

  lowdim_keys:
    q: observation.joint
    dq: observation.velocity
    # ddq: observation.acceleration
    tau: observation.torque
    tau_f: observation.tau_f
    # wrench: observation.wrench

  normalize_mode: gaussian
  normalize_lowdim_keys:
    - q
    - dq
    # - ddq
    - tau_f
    # - wrench

model:
  # Supported values: lstm, gru.
  architecture: gru

  # Remove entries here to run input ablations without changing code.
  inputs:
    - q
    - dq
    # - ddq

  input_dims:
    q: 7
    dq: 7
    # ddq: 7
  output_dim: 7
  target_key: tau_f


  hidden_dim: 128
  num_layers: 2
  head_hidden_dim: 128
  head_num_layers: 2
  activation: relu
  dropout: 0.1

loss:
  # Optional per-joint weights, for example: [1, 1, 1, 1, 1, 1, 1].
  joint_weights: null

train:
  device: cuda:0
  # The low-dimensional cache is device-resident; workers only emit indices.
  batch_size: 512
  num_workers: 2
  val_ratio: 0.1

  # Chronological tail validation with H-1 target samples purged at each
  # boundary, so train/validation windows never share an underlying frame.
  # With multiple independent episodes, split_mode: episode is also valid.
  split_mode: purged_temporal
  seed: 42

  lr: 1.0e-4
  weight_decay: 1.0e-6
  num_epochs: 500
  gradient_clip_norm: 1.0

  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 15
    min_lr: 1.0e-6

  early_stopping:
    enabled: false
    patience: 20
    warmup_epochs: 10
    min_delta: 1.0e-5

  output_dir: outputs/tau_f_sequence/gru_h50_qv2tau_f
  monitor_key: val_loss
  top_k: 5

  ema:
    enabled: true
    decay: 0.99
    update_after_step: 0
    update_every: 1
    use_for_validation: true

  wandb:
    enabled: true
    project: lcp-pinn
    name: tau-f-sequence-lstm-h50-v2
    mode: online
    log_every_steps: 10
