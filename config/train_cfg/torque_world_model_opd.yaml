# OPD Student training. First train a Teacher with torque_world_model.yaml,
# then point distillation.teacher_checkpoint_path at its checkpoint.
dataloader:
  repo_id: wipe_board_wm_lbv3
  root: data/train_episode/wipe_board_wm_lbv3
  backend: lerobot
  video_backend: pyav
  high_fps: 100
  enforce_uniform_high_timestamps: false
  state_history_horizon: 50
  prediction_horizon: 32
  action_condition_horizon: 8
  action_condition_features: [absolute_pose, current_ee_pose, relative_pose]
  current_ee_pose_source: fk
  action_chunk_horizon: 8
  pad_history: true
  pad_future: false
  expert_fps: 25.0
  inference_delay_s: 0.0
  action_resample: nearest
  action_condition_mode: composite
  high_timestamp_key: timing.state_timestamp_ns
  anchor_timestamp_key: timing.action_anchor_timestamp_ns
  high_keys:
    q: observation.joint
    dq: observation.velocity
    ddq: null
    tau: observation.torque
    wrench: observation.wrench_ext
    reference_pose: action.ee_pose
  normalize_mode: gaussian
  normalize_lowdim_keys: [q, dq, tau, wrench, target_relative_pose]

contact_gate:
  enabled: false

model:
  joint_dim: 7
  action_dim: 21
  wrench_dim: 6
  hidden_dim: 128
  state_layers: 2
  action_layers: 2
  attention_heads: 4
  dropout: 0.05
  flow_layers: 4
  flow_attention_heads: 4
  flow_ffn_multiplier: 4
  # Student architecture is unchanged; only its ODE solve count is reduced.
  flow_inference_steps: 2
  flow_solver: heun
  state_estimator:
    sampling_dt: 0.01
    q_mean_window_samples: 10
    q_lowpass_cutoff_hz: 10
    dq_lowpass_cutoff_hz: 6
    ddq_lowpass_cutoff_hz: 3

loss:
  flow_weight: 1.0
  flow_q_weight: 1.0
  flow_dq_weight: 1.0
  flow_tau_weight: 1.0
  flow_wrench_weight: 1.0
  q_weight: 1.0
  dq_weight: 0.5
  tau_weight: 0.5
  wrench_observation_weight: 1.0
  ddq_weight: 0.0
  # Legacy RNEA loss remains zero for the first OPD run.
  wrench_weight: 0.0
  standardize_derived_residuals: true
  standardize_wrench_residual: true

physics:
  rnea:
    enabled: false

distillation:
  enabled: true
  teacher_checkpoint_path: outputs/torque_world_model_test2/checkpoints/epoch_143_val_loss_0.045692.pt
  teacher_steps: 8
  student_steps: 2
  weight: 1.0
  rollout_weight: 1.0
  # Each iteration writes the Student's first 100 Hz state into history.
  rollout_steps: 4
  curriculum:
    enabled: true
    # Early epochs are anchored to Teacher(real history); later epochs put
    # more weight on Student-written histories while retaining base labels.
    epochs: 100
    teacher_weight_start: 1.0
    teacher_weight_end: 0.25
    rollout_weight_start: 0.0
    rollout_weight_end: 1.0

train:
  device: cuda:0
  batch_size: 128
  num_workers: 8
  max_train_steps: 50000
  checkpoint_every_steps: 5000
  val_ratio: 0.1
  split_mode: episode
  seed: 42
  lr: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  output_dir: outputs/torque_world_model_opd
  monitor_key: val_loss
  top_k: 2
  save_latest_checkpoint: true
  ema:
    enabled: true
    decay: 0.999
    update_after_step: 0
    update_every: 1
    use_for_validation: true
  scheduler:
    name: cosine
    T_max: 50000
    eta_min: 0.000001
  early_stopping:
    # Keep val_loss logging, but use the fixed optimizer-step budget by default.
    enabled: false
    patience: 30
    warmup_epochs: 20
    min_delta: 0.000001
  wandb:
    enabled: false
    project: torque-world-model
    name: opd-student
    group: torque-world-model-opd
    tags: [q-dq-tau-wrench, action-chunk, flow-distillation, opd]
    mode: online
    log_every_steps: 10
