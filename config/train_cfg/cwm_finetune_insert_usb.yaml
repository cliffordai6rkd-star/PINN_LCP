# Overlay applied to the pretraining checkpoint configuration.
train_data:
  format: lerobot_v3
  sources:
    - name: insert_usb
      repo_id: insert_usb_lerobot_v3
      root: ../nero_ws/runs/swm/insert_usb_lerobot_v3
train:
  pretrained_checkpoint: outputs/cwm_pretrain_four_tasks/checkpoints/latest.pt
  output_dir: outputs/cwm_finetune_insert_usb
  lr: 0.00001
  batch_size: 64
  max_optimizer_steps: 10000
  checkpoint_every_steps: 1000
  split_mode: episode
  wandb:
    name: cwm-finetune-insert-usb
