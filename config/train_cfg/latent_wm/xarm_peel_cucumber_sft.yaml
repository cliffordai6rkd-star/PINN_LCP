# Nero pretraining -> two independent frozen-Flow xArm SFT tasks.
# Shared Contact WM learned positions: 50 history, 32 future, 8 action tokens.
wm_v3_only: true
train_data:
  format: lerobot_v3
  sources:
  - name: peel_cucumber
    repo_id: peel_cucumber_lerobot_v3
    root: data/xarm_co_v3/peel_cucumber_v3
action_contract:
  semantic: va_measured_joint_snapshot_fk
  type: absolute_ee_pose
  coordinate_frame: link_base
  representation: xyz_quaternion
  quaternion_order: xyzw
  quaternion_sign: canonical_w_nonnegative
  absolute_or_relative: absolute
dataloader:
  tau_ext_generation:
    enabled: true
    checkpoint: outputs/tau_free_sequence/xarm_offline_teacher/model.pt
    cache_dir: outputs/cache/wm_tau_labels
    device: cpu
    threads: 2
    force_rebuild: false
  backend: lerobot
  v3_only: true
  high_fps: 100
  state_history_horizon: 50
  prediction_horizon: 32
  action_condition_horizon: 8
  action_start_offset: 1
  action_condition_mode: direct
  action_key: action.ee_pose
  high_timestamp_key: timing.state_timestamp_ns
  anchor_timestamp_key: timing.action_anchor_timestamp_ns
  action_index_key: timing.action_index
  action_anchor_timestamp_key: timing.action_anchor_timestamp_ns
  pad_history: true
  pad_future: false
  expert_fps: 25.0
  inference_delay_s: 0.0
  action_resample: previous
  action_augmentation:
    enabled: false
    gaussian_std: 0.0
    temporal_jitter: 0
    cached_policy_action_probability: 0.0
  filters:
    q:
      enabled: true
      source_already_filtered: false
      operations:
      - type: lowpass
        cutoff_hz: 15.0
        order: 1
    dq:
      enabled: true
      source_already_filtered: false
      operations:
      - type: lowpass
        cutoff_hz: 15.0
        order: 1
    delta_q:
      enabled: true
      source_already_filtered: false
      operations:
      - type: lowpass
        cutoff_hz: 15.0
        order: 1
    tau:
      enabled: true
      source_already_filtered: false
      operations:
      - type: lowpass
        cutoff_hz: 15.0
        order: 1
  filter_timestamp_unit: ns
  normalize_mode: gaussian
  normalize_lowdim_keys:
  - q
  - dq
  - delta_q
  - tau
  - action
  action_fk:
    urdf_path: ../../xarm_ws/gello_teleop/models/xarm7_dynamics.urdf
    joint_key: action.joint
    pose_key: action.ee_pose
    base_frame: link_base
    frame_name: link_eef
    joint_names:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
contact_gate:
  enabled: true
  label_mode: three_phase
  metric: tau_ext_l1
  tau_ext_source: tau_measured_minus_tau_free
  precontact_duration_s: 1.0
  contact_threshold: 11.705677733654019
  class_weights:
  - 1.0
  - 1.0
  - 1.0
model:
  inputs:
  - q
  - dq
  - delta_q
  - tau
  outputs:
  - q
  - tau
  joint_dim: 7
  action_dim: 7
  contact_state_count: 3
  hidden_dim: 128
  dropout: 0.01
  flow_layers: 4
  flow_attention_heads: 4
  flow_ffn_multiplier: 4
  flow_inference_steps: 16
  flow_solver: heun
  flow_source_mode: gaussian
  family: latent_carswm_lstm_v2
  lstm_layers: 2
  pretrained_taufree_path: null
  latent_dim: 128
  future_encoder_layers: 2
  decoder_layers: 2
  decoder_hidden_dim: 128
  temporal_position_encoding: contact_wm_learned_index
  local_state_dim: 64
  flow_adapter_rank: 8
train:
  device: cuda:0
  downsample: false
  dataset_on_device: false
  batch_size: 128
  gradient_every: 1
  num_workers: 2
  prefetch_factor: 1
  val_num_workers: 0
  val_prefetch_factor: 1
  val_persistent_workers: false
  max_optimizer_steps: 50000
  num_epochs: 1000000
  checkpoint_every_steps: 10000
  val_ratio: 0.05
  val_every: 10
  split_mode: episode
  seed: 42
  lr: 3.0e-05
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
  pin_memory: true
  non_blocking_transfer: true
  persistent_workers: false
  defer_metric_sync: true
  device_batch_keys:
  - q
  - dq
  - delta_q
  - tau
  - action
  - action_mask
  - q_future
  - dq_future
  - delta_q_future
  - tau_future
  - contact_future
  - importance_weight
  - contact
  - history_valid_mask
  - history_grid_positions
  - action_grid_positions
  - future_grid_positions
  amp:
    enabled: true
    dtype: bfloat16
  validation_flow_time: 0.5
  rollout_validation:
    enabled: false
    feedback_reconditioned: false
    replace_val_loss: false
    replace_val_loss_metric: feedback_u32_energy_score
    steps: 16
    solver: heun
    source_seed: 1234
    max_batches: 0
    num_samples: 8
    free_running_steps: 8
    free_running_max_batches: 8
    horizons:
    - 16
    - 32
    divergence_abs_threshold: 100.0
  probabilistic_validation:
    enabled: true
    num_samples: 8
    max_batches: 8
    every: 1
    replace_val_loss: true
    per_task_max_batches: 8
    latent_ablation: true
  checkpoint_visualization:
    enabled: true
    every_saved_checkpoint: true
    fixed_validation_indices: {}
    paired_validation_indices: {}
    num_samples: 32
    seed: 2027
    use_ema: true
    denormalize_for_plot: true
    wrist_joint_index: 5
    plot_ranges: {}
    flow_steps: 16
  output_dir: outputs/latent_wm_v2/xarm_peel_cucumber_sft_frozen
  monitor_key: val_loss
  top_k: 5
  save_latest_checkpoint: true
  contact_sampling:
    enabled: true
    phase_weights:
    - 1.0
    - 5.0
    - 5.0
    future_phase_reduction: max
    replacement: true
  ema:
    enabled: true
    decay: 0.9999
    update_after_step: 0
    update_every: 1
    use_for_validation: true
  scheduler:
    name: cosine
    warmup_steps: 500
    eta_min: 1.0e-06
  early_stopping:
    enabled: false
    patience: 30
    warmup_epochs: 20
    min_delta: 1.0e-06
  wandb:
    enabled: true
    project: contact-world-model
    name: latent_wm_v2_xarm_peel_cucumber_sft_frozen
    group: latent-wm-v2-transfer
    tags:
    - q-dq-deltaq-tau
    - direct-action
    - contact-three-phase
    - flow-matching
    - conditional-codec
    - residual-q
    - stable-latent
    mode: online
    log_every_steps: 10
  stage: sft
  recovery_every_steps: 1000
codec:
  checkpoint_path: null
  max_optimizer_steps: 20000
  latent_std_floor: 0.0001
  contact_weight: 1.0
  lr: 0.0003
loss:
  lambda_free: 0.1
sft:
  pretrained_checkpoint: outputs/latent_wm_v2/nero_all/checkpoints/latest.pt
  use_ema: true
  flow_mode: frozen
  train_motion_encoder: true
  lambda_fm: 1.0
  lambda_reconstruction: 1.0
