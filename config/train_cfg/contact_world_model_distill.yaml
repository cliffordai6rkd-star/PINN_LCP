# Overlay on the original teacher checkpoint data/model/action/normalizer contract.
distillation:
  enabled: true
  teacher_checkpoint_path: /absolute/path/to/original_teacher_ema.pt
  student_steps: 4
  teacher_steps: 64
  local_weight: 1.0
  terminal_weight: 1.0
  q_d1_weight: 0.05
  q_d2_weight: 0.01
  # D1(q)[t]=q[t+1]-q[t]; D2(q)[t]=q[t+2]-2q[t+1]+q[t].
  # Both use adjacent physical future frames at teacher-normalized q scale.
  student_start_probability_max: 0.5
  student_start_probability_warmup_steps: 5000
  contact_distill_weight: 0.1
  contact_ce_weight: 0.0
  validation_seed: 2026
  validation_num_samples: 4
  validation_max_batches: 0
  latency_batches: 1
train:
  device: cuda:0
  output_dir: outputs/contact_world_model_distill_s4
  lr: 3.0e-5
  max_optimizer_steps: 100000
  checkpoint_every_steps: 5000
  batch_size: 64
  top_k: 3
  ema:
    enabled: true
    decay: 0.999
    update_after_step: 0
    update_every: 1
    use_for_validation: true
