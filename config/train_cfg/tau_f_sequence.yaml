dataloader:
  repo_id: tau_refinement_matched_lerobotv3
  root: data/train_episode/tau_refinement_matched_lerobotv3
  load_images: false
  video_backend: torchcodec

  # FACTR 2/NEXT uses a 50-step history at 100 Hz.
  horizon: 50
  # NEXT-style samples contain 50 real frames; do not train on zero-padded starts.
  pad_history: false

  lowdim_keys:
    q: observation.joint
    dq: observation.velocity
    ddq: observation.acceleration
    delta_q: observation.delta_q
    tau: observation.torque
    tau_f: observation.tau_f

  normalize_mode: gaussian
  normalize_lowdim_keys:
    - q
    - dq
    - delta_q
    - tau_f

model:
  # Every window is independent. The causal TCN has an exact 50-frame
  # receptive field and an explicit current-state skip.
  history_mode: stateless_sliding_window
  architecture: lstm
  tcn_kernel_size: 2
  tcn_dilations: [1, 2, 4, 8, 16, 18]

  # Remove entries here to run input ablations without changing code.
  inputs:
    - q
    - dq
    - delta_q


  input_dims:
    q: 7
    dq: 7
    delta_q: 7

  output_dim: 7
  target_key: tau_f
  # Deployment validates this contract before enabling tau_ext_cal.
  target_contract: matched_causal_torque_filter_v1
  # Contract metadata only: do not post-filter tau_f or tau_f_pred. It records
  # the source filter shared by measured tau and independently computed tau_id.
  target_filter:
    cutoff_hz: 10.0
    median_window: 1


  hidden_dim: 128
  # Retained for backward-compatible recurrent ablations; ignored by the TCN.
  num_layers: 2
  # NEXT head: recurrent hidden 128 -> MLP hidden 256 -> 7 torques.
  head_hidden_dim: 256
  head_num_layers: 2
  activation: relu
  dropout: 0.2

loss:
  # Ordinary seven-axis MSE in normalized target space. The tau_f rollout below
  # is visualization-only and does not add a wrench term to this training loss.
  type: mse
  # Optional per-joint weights, for example: [1, 1, 1, 1, 1, 1, 1].
  joint_weights: null

# Offline visualization replays the same causal state/RNEA/filter chain used by
# nero_ws before mapping tau_ext to the gripper-frame wrench.
rollout:
  measured_tau_already_filtered: true
  matched_torque_filter:
    cutoff_hz: 10.0
    median_window: 1

physics:
  wrench_damping: 0.02
  pinocchio:
    urdf_path: sim_mesh/nero/nero_with_gripper.urdf
    frame_name: gripper_tcp
    reference_frame: LOCAL
    locked_joint_names: [gripper, gripper_joint1, gripper_joint2]

train:
  device: cuda:0
  # The low-dimensional cache is device-resident; workers only emit indices.
  batch_size: 512
  num_workers: 2
  val_ratio: 0.1

  # Random windows keep mixed motion regimes represented on both sides. This
  # is an interpolation/checkpoint-ranking split, not an unbiased generalization test.
  split_mode: sample
  seed: 42

  lr: 1.0e-4
  weight_decay: 1.0e-4
  num_epochs: 1000
  gradient_clip_norm: 1.0

  # Re-run the final epoch model in eval mode on the train split. This roughly
  # doubles epoch inference work, but separates dropout noise from split bias.
  train_eval:
    enabled: true

  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 5
    min_lr: 1.0e-5

  early_stopping:
    enabled: true
    patience: 20
    warmup_epochs: 10
    min_delta: 1.0e-5

  output_dir: outputs/tau_f_sequence/lstm
  monitor_key: val_loss
  top_k: 5

  ema:
    enabled: false
    decay: 0.999
    update_after_step: 0
    update_every: 1
    use_for_validation: true

  wandb:
    enabled: false
    project: lcp-pinn
    name: tau-f-tcn-h50-sample-mse
    mode: online
    log_every_steps: 10
