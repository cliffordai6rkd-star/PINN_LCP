dataloader:
  repo_id: insert_usb_lerobotv3_dual_rate
  root: ../nero_ws/runs/insert_usb_lerobotv3_dual_rate
  video_backend: torchcodec

  # H and T are high-rate steps. T is independent of the action chunk length.
  high_fps: 80
  state_history_horizon: 50
  prediction_horizon: 40
  pad_history: true
  pad_future: false

  # Simulated low-rate action expert. A held chunk is refreshed at 5 Hz.
  expert_fps: 5.0
  action_chunk_horizon: 8
  # Configurable t: image anchor -> first future action-target waypoint.
  inference_delay_s: 0.2
  action_resample: pose
  action_condition_mode: relative_pose

  high_timestamp_key: timing.high_timestamp_ns
  anchor_timestamp_key: timing.anchor_timestamp_ns
  high_keys:
    q: observation.joint
    dq: observation.velocity
    ddq: observation.acceleration
    tau: observation.torque
    wrench: observation.wrench_ext
    reference_pose: reference.ee_pose

  normalize_mode: gaussian
  normalize_lowdim_keys:
    [q, tau, dq, ddq, wrench, target_relative_pose]

contact_gate:
  enabled: true
  force_on_threshold_n: 0.3
  force_off_threshold_n: 0.1
  consecutive_frames: 5
  positive_class_weight: auto
  probability_threshold: 0.5

model:
  joint_dim: 7
  action_dim: 7
  hidden_dim: 128
  state_layers: 2
  action_layers: 2
  attention_heads: 4
  dropout: 0.05

  flow_layers: 4
  flow_attention_heads: 4
  flow_ffn_multiplier: 4
  flow_inference_steps: 8
  flow_solver: heun
  contact_logit_scale: 4.0

  # q is the only source of derivatives used by the prediction/physics path.
  state_estimator:
    sampling_dt: 0.0125
    q_mean_window_samples: 10
    q_lowpass_cutoff_hz: 10
    dq_lowpass_cutoff_hz: 6
    ddq_lowpass_cutoff_hz: 3

loss:
  flow_weight: 1.0
  flow_q_weight: 1.0
  flow_tau_weight: 1.0
  flow_contact_weight: 1.0
  q_weight: 1.0
  tau_weight: 1.0
  dq_weight: 0.2
  ddq_weight: 0.1
  contact_weight: 1.0
  wrench_weight: 0.5
  wrench_warmup_steps: 3000
  standardize_derived_residuals: true
  standardize_wrench_residual: true

physics:
  # This is a local RNEA expansion around recorded future states.
  tau_f_checkpoint_path: outputs/tau_f_sequence/gru_h50_pro/checkpoints/epoch_125_val_loss_0.002037.pt
  wrench_damping: 0.02
  soft_contact_gate: true
  cache_chunk_size: 2048
  pinocchio:
    urdf_path: sim_mesh/nero/nero_with_gripper.urdf
    frame_name: gripper_tcp
    reference_frame: LOCAL
    locked_joint_names: [gripper, gripper_joint1, gripper_joint2]

train:
  device: cuda:0
  batch_size: 512
  num_workers: 8
  num_epochs: 3000
  val_ratio: 0.2
  split_mode: episode
  seed: 42

  lr: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  validation_flow_time: 0.5
  output_dir: outputs/torque_world_model_test1
  monitor_key: val_loss
  top_k: 5

  ema:
    enabled: true
    decay: 0.999
    update_after_step: 0
    update_every: 1
    use_for_validation: true

  scheduler:
    name: cosine
    T_max: 200
    eta_min: 0.000001

  early_stopping:
    enabled: true
    patience: 30
    warmup_epochs: 20
    min_delta: 0.000001

  wandb:
    enabled: false
    project: torque-world-model
    name: history-action-cfm
    group: torque-world-model
    tags: [q-tau, action-chunk, flow-matching, rnea, tau-f]
    mode: online
    log_every_steps: 10
