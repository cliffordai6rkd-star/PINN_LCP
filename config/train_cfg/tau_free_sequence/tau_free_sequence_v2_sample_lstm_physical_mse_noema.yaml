dataloader:
  repo_id: tau_refinement_ped_lerobotv3
  root: data/train_episode/tau_refinement_ped_lerobotv3
  contact_free: true
  load_images: false
  video_backend: torchcodec
  horizon: 50
  pad_history: false

  lowdim_keys:
    q: observation.joint
    dq: observation.velocity
    delta_q: observation.delta_q
    tau: observation.torque

  # Inputs and outputs stay normalized for conditioning and model numerics.
  # The loss below explicitly denormalizes tau before computing seven-axis MSE.
  normalize_mode: gaussian
  normalize_lowdim_keys: [q, dq, delta_q, tau]

model:
  task: free_space_inverse_dynamics
  history_mode: stateless_sliding_window
  architecture: lstm
  inputs: [q, dq, delta_q]
  input_dims:
    q: 7
    dq: 7
    delta_q: 7
  output_dim: 7
  target_key: tau
  hidden_dim: 128
  num_layers: 2
  head_hidden_dim: 256
  head_num_layers: 2
  activation: relu
  dropout: 0.1
  # observation.torque in this dataset is already causally low-pass filtered at
  # 10 Hz. Do not apply a second low-pass; add a configurable causal median to
  # reject the remaining isolated spikes.
  target_filter:
    enabled: true
    median_window: 3
    apply_additional_lowpass: false
    # apply_additional_lowpass: true
    # cutoff_hz: 10.0
    timestamp_key: timestamp

loss:
  type: mse
  # Compute MSE_j in Nm^2 for each joint, then average the seven values.
  # With joint_weights=null, an equal absolute Nm error has equal cost on all axes.
  torque_loss_space: physical_nm
  # Options: equal, mean_abs, max_abs, manual. Automatic modes use train split only.
  joint_weight_mode: manual
  joint_weights: null
  joint_weights: [1.7, 2.5, 1.7, 1.7, 0.2, 0.2, 1]
  tau_weight: 1
  wrench_weight: 0.1
  force_scale_n: 1.0
  moment_scale_nm: 0.1


physics:
  wrench_damping: 0.02
  pinocchio:
    urdf_path: sim_mesh/nero/nero_with_gripper.urdf
    frame_name: gripper_tcp
    reference_frame: LOCAL
    locked_joint_names: [gripper, gripper_joint1, gripper_joint2]

train:
  device: cuda:0
  batch_size: 512
  num_workers: 4
  val_ratio: 0.1
  split_mode: sample
  seed: 42
  deterministic: false
  cudnn_benchmark: true

  lr: 1.0e-3
  weight_decay: 1.0e-6
  num_epochs: 1000
  gradient_clip_norm: 1.0
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 5
    min_lr: 1.0e-6

  early_stopping:
    enabled: true
    patience: 20
    warmup_epochs: 10
    # This value is now in Nm^2 because the monitored metric is physical MSE.
    min_delta: 1.0e-5

  output_dir: outputs/tau_free_sequence/flstm_h50_sample_manual
  monitor_key: val_tau_mse_nm2
  scheduler_monitor_key: val_tau_mse_nm2
  early_stopping_monitor_key: val_tau_mse_nm2
  top_k: 5

  ema:
    enabled: false

  wandb:
    enabled: false
