# A checkpoint file can be given directly. For epoch-based Flow WM directories,
# the newest epoch_*.pt is selected; step and legacy loss files are fallbacks.
checkpoint_path: outputs/torque_world_model_v4_opd/checkpoints

dataset:
  v3_only: true
  backend: lerobot
  repo_id: push_button_lerobot_v3
  root: ../nero_ws/runs/push_button_lerobot_v3
  video_backend: pyav
  high_fps: 100

inference:
  device: cuda:0
  # "ema" loads checkpoint["model"], which is also used for validation.
  # Use "raw" only when deliberately comparing the non-EMA weights.
  weights: ema
  batch_size: 8
  num_workers: 0
  # ODE integration parameters. Heun evaluates the Flow decoder twice per step.
  flow_steps: 2
  flow_solver: heun

selection:
  # null evaluates all episodes. Keep a short explicit list for quick plots.
  episode_indices: [0]
  # 32 rows gives non-overlapping 0.32 s windows at 100 Hz. Set 4 to emulate
  # a 25 Hz receding-horizon refresh, or 1 to inspect every valid anchor.
  sample_stride: 32
  start_offset: 0
  max_rollouts_per_episode: 8
  max_total_rollouts: null

plot:
  output_dir: outputs/torque_world_model_rollout
  signals: [q, dq, delta_q, tau, contact]
  dpi: 160
  subplot_columns: 2
  # Saves timestamps and all data/pred arrays beside the PNG files.
  save_arrays: true
